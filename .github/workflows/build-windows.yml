name: Build Windows EXE (بدون بايثون على جهازك)

# يبدأ البناء تلقائيًا عند رفع الملفات، ويمكن أيضًا تشغيله يدويًا من تبويب Actions
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (on the build server only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the application with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "SpeechToText"
          --icon "assets/icon.ico"
          --add-data "assets;assets"
          --collect-all PySide6
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all sounddevice
          --collect-all soundfile
          --collect-all deep_translator
          --collect-all tokenizers
          app.py

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/SpeechToText/*" -DestinationPath "SpeechToText-Portable.zip"

      - name: Create installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer.iss
          } else {
            Write-Host "Inno Setup not found on this runner - skipping installer, portable ZIP is enough."
          }

      - name: Upload ready-to-use files (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SpeechToText-Windows-NoPython
          path: |
            installer-output/SpeechToText-Setup.exe
            SpeechToText-Portable.zip
          if-no-files-found: warn
          retention-days: 30
